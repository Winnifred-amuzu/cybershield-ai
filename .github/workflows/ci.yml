name: Cyber-Shield AI CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q backend tests ml
      - name: Run tests
        run: pytest -q
      - name: API smoke test
        run: python scripts/smoke_test_api.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android
      - name: Install packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=CYBERSHIELD_API_URL=http://10.0.2.2:8000
