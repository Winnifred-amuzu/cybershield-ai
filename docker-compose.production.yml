services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybershield}
      POSTGRES_USER: ${POSTGRES_USER:-cybershield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cybershield]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      CYBERSHIELD_ENV: production
      CYBERSHIELD_JWT_SECRET: ${CYBERSHIELD_JWT_SECRET:?Set CYBERSHIELD_JWT_SECRET}
      CYBERSHIELD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cybershield}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cybershield}
      CYBERSHIELD_CORS_ORIGINS: ${CYBERSHIELD_CORS_ORIGINS:?Set CYBERSHIELD_CORS_ORIGINS}
      CYBERSHIELD_SCAM_THRESHOLD: ${CYBERSHIELD_SCAM_THRESHOLD:-0.50}
      CYBERSHIELD_MAX_MESSAGE_LENGTH: ${CYBERSHIELD_MAX_MESSAGE_LENGTH:-5000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:8000:8000"
    networks: [cybershield]

volumes:
  postgres_data:

networks:
  cybershield:
    driver: bridge
